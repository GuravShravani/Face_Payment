<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacePay Merchant - Profile Completion</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QuaggaJS for Barcode Scanning -->
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <!-- ZXing Browser - Reliable barcode decoder for images -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        /* ===== FACE PAY THEME ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --secondary: #34a853;
            --light-gray: #f8f9fa;
            --medium-gray: #e8eaed;
            --dark-gray: #5f6368;
            --text: #202124;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #1a73e8 0%, #34a853 100%);
            --error: #ea4335;
            --success: #34a853;
            --warning: #fbbc04;
        }
        [data-theme="dark"] {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --secondary: #34a853;
            --light-gray: #2d2d2d;
            --medium-gray: #3c4043;
            --dark-gray: #bdc1c6;
            --text: #e8eaed;
            --white: #202124;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --error: #f28b82;
            --success: #81c995;
            --warning: #fdd663;
        }
        body { background-color: #f5f7fa; color: var(--text); line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--gradient); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-size: 20px; z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .dashboard-container { display: flex; min-height: 100vh; opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; background: var(--white); border-right: 1px solid var(--medium-gray);
            display: flex; flex-direction: column; transition: all 0.3s;
            position: fixed; height: 100vh; z-index: 100;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--medium-gray); display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--primary); }
        .logo i { font-size: 28px; color: var(--primary); }
        .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--dark-gray); cursor: pointer; padding: 5px; }
        
        .merchant-profile { 
            padding: 20px; border-bottom: 1px solid var(--medium-gray); 
            display: flex; align-items: center; gap: 15px; cursor: pointer; 
            transition: all 0.3s; position: relative;
        }
        .merchant-profile:hover { background: var(--light-gray); }
        .profile-avatar { position: relative; }
        .profile-avatar i { font-size: 50px; color: var(--primary); }
        .profile-avatar .edit-overlay { 
            position: absolute; bottom: 0; right: 0; background: var(--primary); 
            width: 20px; height: 20px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; color: white; 
            font-size: 12px; opacity: 0; transition: opacity 0.3s; 
        }
        .merchant-profile:hover .edit-overlay { opacity: 1; }
        .profile-info { flex: 1; }
        .profile-info h3 { 
            font-size: 16px; margin-bottom: 2px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .profile-info p { 
            font-size: 12px; color: var(--dark-gray); margin-bottom: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .status-indicator { 
            display: flex; align-items: center; gap: 8px; font-size: 12px;
            flex-wrap: wrap;
        }
        .status-dot { width: 8px; height: 8px; background: var(--secondary); border-radius: 50%; animation: pulse 2s infinite; }
        .profile-completion-badge { 
            background: var(--warning); color: #000; font-size: 11px; 
            padding: 2px 6px; border-radius: 12px; margin-left: auto;
            font-weight: 600;
        }
        .profile-completion-badge.completed {
            background: var(--success);
            color: white;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .sidebar-nav { flex: 1; padding: 20px 0; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .nav-item { margin: 5px 15px; border-radius: 8px; overflow: hidden; }
        .nav-item a { display: flex; align-items: center; padding: 12px 15px; color: var(--dark-gray); text-decoration: none; transition: all 0.3s; gap: 12px; }
        .nav-item a i { width: 20px; text-align: center; font-size: 18px; }
        .nav-item.active a { background: var(--primary); color: white; }
        .nav-item:hover:not(.active) a { background: var(--light-gray); color: var(--text); }
        .badge { margin-left: auto; background: var(--secondary); color: white; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--medium-gray); }
        .upi-info { 
            display: flex; align-items: center; gap: 10px; padding: 12px; 
            background: var(--light-gray); border-radius: 8px; margin-bottom: 15px;
            cursor: pointer; transition: all 0.3s;
        }
        .upi-info:hover { background: var(--medium-gray); }
        .upi-info i { font-size: 20px; color: var(--primary); }
        .upi-info-content { overflow: hidden; }
        .upi-info p { font-size: 11px; color: var(--dark-gray); margin-bottom: 2px; }
        .upi-info strong { 
            font-size: 13px; color: var(--text); display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .logout-btn { 
            width: 100%; display: flex; align-items: center; justify-content: center; 
            gap: 10px; padding: 12px; background: var(--primary); color: white; 
            border: none; border-radius: 6px; font-size: 14px; cursor: pointer; 
            transition: all 0.3s; 
        }
        .logout-btn:hover { background: var(--primary-dark); }
        
        /* ===== MAIN CONTENT ===== */
        .main-content { flex: 1; margin-left: 280px; transition: margin 0.3s; }
        .top-header {
            padding: 20px 30px; background: var(--white); border-bottom: 1px solid var(--medium-gray);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;
        }
        .header-left h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; }
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dark-gray); }
        .breadcrumb i { font-size: 12px; }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--dark-gray); }
        .search-box input { 
            width: 300px; padding: 10px 15px 10px 45px; 
            border: 1px solid var(--medium-gray); border-radius: 6px; 
            background: var(--light-gray); color: var(--text); font-size: 14px; 
            transition: all 0.3s;
        }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .header-actions { display: flex; gap: 10px; }
        .header-btn { 
            width: 40px; height: 40px; border-radius: 50%; border: none; 
            background: var(--light-gray); color: var(--text); font-size: 18px; 
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .header-btn:hover { background: var(--primary); color: white; }
        .notification-badge { position: absolute; top: -5px; right: -5px; background: var(--secondary); color: white; font-size: 12px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .content-area { padding: 30px; min-height: calc(100vh - 120px); }
        
        /* ===== PROFILE COMPLETION STYLES ===== */
        .profile-container {
            max-width: 900px; margin: 0 auto; background: var(--white); 
            border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
        }
        
        .profile-header {
            background: var(--gradient); color: white; padding: 30px;
            text-align: center; position: relative;
        }
        
        .profile-header h2 { font-size: 28px; margin-bottom: 10px; }
        .profile-header p { opacity: 0.9; font-size: 16px; }
        
        .completion-meter {
            background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px;
            margin: 20px auto 0; max-width: 500px; overflow: hidden;
        }
        
        .completion-fill {
            height: 100%; background: white; width: 0%;
            transition: width 0.5s ease; border-radius: 4px;
        }
        
        .completion-percentage {
            position: absolute; top: 20px; right: 30px;
            background: rgba(255,255,255,0.2); padding: 8px 16px;
            border-radius: 20px; font-weight: 600; font-size: 18px;
        }
        
        .profile-sections {
            padding: 30px;
        }
        
        .profile-section {
            margin-bottom: 30px; border: 1px solid var(--medium-gray);
            border-radius: 8px; overflow: hidden;
        }
        
        .section-header {
            background: var(--light-gray); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.3s;
        }
        
        .section-header:hover { background: var(--medium-gray); }
        
        .section-header h3 {
            font-size: 18px; font-weight: 600; display: flex;
            align-items: center; gap: 10px;
        }
        
        .section-header h3 i {
            color: var(--primary); font-size: 20px;
        }
        
        .section-status {
            font-size: 12px; padding: 4px 12px;
            border-radius: 20px; background: var(--warning); color: #000;
        }
        
        .section-status.completed {
            background: var(--success); color: white;
        }
        
        .section-content {
            padding: 20px; display: none;
        }
        
        .section-content.active {
            display: block; animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block; margin-bottom: 8px; font-weight: 500;
            color: var(--text); font-size: 14px;
        }
        
        .form-group label .required {
            color: var(--error); margin-left: 4px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%; padding: 12px 15px;
            border: 2px solid var(--medium-gray); border-radius: 8px;
            background: var(--white); color: var(--text); font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        
        .form-group input.valid {
            border-color: var(--success);
        }
        
        .form-group input.invalid {
            border-color: var(--error);
        }
        
        .form-group input[readonly] {
            background: var(--light-gray);
            cursor: not-allowed;
        }
        
        .validation-message {
            font-size: 12px; margin-top: 5px; min-height: 18px;
            display: flex; align-items: center; gap: 4px;
        }
        
        .validation-message.error {
            color: var(--error);
        }
        
        .validation-message.success {
            color: var(--success);
        }
        
        .input-hint {
            font-size: 12px; color: var(--dark-gray); margin-top: 4px;
        }
        
        .age-display {
            background: var(--light-gray);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        
        .age-display i {
            font-size: 24px;
            color: var(--primary);
        }
        
        .age-display .age-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .age-display .age-label {
            font-size: 14px;
            color: var(--dark-gray);
        }
        
        .bank-details-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }
        
        .full-width {
            grid-column: span 2;
        }
        
        .save-indicator {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 14px; padding: 8px 16px; border-radius: 20px;
            background: var(--light-gray); transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .save-indicator.saving {
            color: var(--warning);
        }
        
        .save-indicator.saved {
            color: var(--success);
        }
        
        .save-indicator i {
            font-size: 16px;
        }
        
        .profile-actions {
            display: flex; justify-content: flex-end; gap: 15px;
            margin-top: 30px; padding-top: 20px;
            border-top: 1px solid var(--medium-gray);
        }
        
        .btn-primary, .btn-secondary {
            padding: 12px 24px; border-radius: 8px; border: none;
            font-size: 15px; font-weight: 500; cursor: pointer;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary); color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark); transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: var(--light-gray); color: var(--text);
        }
        
        .btn-secondary:hover {
            background: var(--medium-gray);
        }
        
        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
        }
        
        /* ===== IMPROVED CHECKBOX STYLES ===== */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 10px 0;
            user-select: none;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
            margin: 0;
            flex-shrink: 0;
        }
        
        .checkbox-wrapper .checkbox-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            line-height: 1.4;
        }
        
        .gst-section-container {
            margin-top: 20px;
            padding: 20px;
            background: var(--light-gray);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
        }
        
        .gst-section-container.hidden {
            display: none;
        }
        
        .gst-verification {
            display: flex;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .gst-verification .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        .verify-btn {
            padding: 12px 24px;
            background: var(--light-gray);
            border: 2px solid var(--medium-gray);
            border-radius: 8px;
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            margin-top: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .verify-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .verify-btn.verified {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .verify-btn.verified:hover {
            background: #0f9d58;
        }
        
        .verify-btn i {
            font-size: 16px;
        }
        
        .bank-logo {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; background: var(--light-gray);
            border-radius: 8px; margin-bottom: 15px;
        }
        
        .bank-logo i {
            font-size: 24px; color: var(--primary);
        }
        
        .toast-notification {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--white); border-left: 4px solid var(--primary);
            padding: 16px 20px; border-radius: 8px; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 12px; z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .toast-notification.success { border-left-color: var(--success); }
        .toast-notification.error { border-left-color: var(--error); }
        .toast-notification.warning { border-left-color: var(--warning); }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* ===== CARDS & TABLES ===== */
        .welcome-message { 
            background: var(--gradient); color: white; padding: 40px; 
            border-radius: 12px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 30px; animation: slideUp 0.5s ease; 
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .welcome-text h2 { font-size: 32px; margin-bottom: 10px; }
        .welcome-text p { font-size: 16px; opacity: 0.9; max-width: 600px; }
        .welcome-illustration i { font-size: 120px; opacity: 0.2; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--white); padding: 25px; border-radius: 8px; 
            box-shadow: var(--shadow); transition: all 0.3s; border-left: 4px solid var(--primary); 
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
        .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .stat-header i { font-size: 24px; color: var(--primary); }
        .stat-title { font-size: 14px; color: var(--dark-gray); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .stat-change { font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .stat-change.positive { color: var(--secondary); }
        .stat-change.negative { color: #ea4335; }
        
        .table-container { 
            background: var(--white); border-radius: 8px; box-shadow: var(--shadow); 
            overflow: hidden; margin-bottom: 30px; 
        }
        .table-header { 
            padding: 20px; border-bottom: 1px solid var(--medium-gray); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .table-header h3 { font-size: 18px; font-weight: 600; }
        .table-actions { display: flex; gap: 10px; }
        
        .table { width: 100%; border-collapse: collapse; }
        .table th { 
            background: var(--light-gray); padding: 15px; text-align: left; 
            font-weight: 600; color: var(--dark-gray); font-size: 14px; 
            border-bottom: 1px solid var(--medium-gray); 
        }
        .table td { padding: 15px; border-bottom: 1px solid var(--medium-gray); }
        .table tr:last-child td { border-bottom: none; }
        .table tr:hover td { background: var(--light-gray); }
        
        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status.paid { background: #d1fae5; color: #065f46; }
        .status.pending { background: #fef3c7; color: #92400e; }
        .status.failed { background: #fee2e2; color: #991b1b; }
        
        .stock-indicator { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .stock-indicator.low { background: #fee2e2; color: #991b1b; }
        .stock-indicator.medium { background: #fef3c7; color: #92400e; }
        .stock-indicator.high { background: #d1fae5; color: #065f46; }
        .category-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #e8f0fe; color: var(--primary); }
        
        /* ===== MODALS ===== */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: var(--white); border-radius: 12px; width: 90%; max-width: 800px; 
            max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
            animation: modalSlide 0.3s ease; 
        }
        @keyframes modalSlide { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { 
            padding: 20px; border-bottom: 1px solid var(--medium-gray); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .modal-header h3 { font-size: 20px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 24px; color: var(--dark-gray); cursor: pointer; padding: 5px; }
        .modal-body { padding: 20px; }
        .modal-footer { 
            padding: 20px; border-top: 1px solid var(--medium-gray); 
            display: flex; justify-content: flex-end; gap: 10px; 
        }
        
        /* ===== SCANNER ===== */
        .scanner-container { display: flex; flex-direction: column; gap: 20px; }
        .scanner-viewport { 
            position: relative; width: 100%; height: 300px; 
            background: #000; border-radius: 8px; overflow: hidden; 
        }
        #interactive.viewport { position: relative; width: 100%; height: 300px; overflow: hidden; background: #000; border-radius: 8px; }
        #interactive.viewport canvas, #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        #interactive.viewport canvas.drawingBuffer { position: absolute; top: 0; left: 0; z-index: 2; }
        .scanner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .scanning-line { 
            position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; 
            background: rgba(26,115,232,0.8); box-shadow: 0 0 10px rgba(26,115,232,0.5);

        @media (max-width: 1200px) {

            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; }

        @media (max-width: 768px) {

            .content-area { padding: 15px; }

<body>
    <!-- Initial Loading Screen -->
    <div id="loading">
        <div class="loading-spinner"></div>
        <p>Loading Merchant Dashboard...</p>
    </div>
    
    <!-- Main App Container -->
    <div id="app"></div>

    <script>
        // ===== DASHBOARD STATE =====
        let dashboardState = {
            merchant: {
                name: "Facepay",
                email: "business@facepaysolution.com",
                dateOfBirth: "",
                age: 0,
                phone: "",
                altPhone: "",
                address: "",
                city: "",
                pincode: "",
                upiId: "",
                bankName: "",
                accountNo: "",
                ifscCode: "",
                accountType: "savings",
                gstNo: "",
                gstRegisteredName: "",
                businessType: "proprietorship",
                isGstRegistered: false,
                gstVerified: false,
                profileCompleted: false,
                profileCompletionPercentage: 0
            },
            stats: { totalRevenue: 125000, pendingInvoices: 5, totalProducts: 24, recentTransactions: 8 },
            products: [
                { id: 1, name: "Laptop Pro", price: 89999, stock: 12, category: "electronics", barcode: "8901234567890", addedDate: "2024-01-15" },
                { id: 2, name: "Wireless Mouse", price: 1999, stock: 45, category: "electronics", barcode: "123456789012", addedDate: "2024-01-20" },
                { id: 3, name: "Office Chair", price: 12999, stock: 8, category: "furniture", barcode: "978020137962", addedDate: "2024-02-01" },
                { id: 4, name: "Webcam HD", price: 3499, stock: 23, category: "electronics", barcode: "4006381333931", addedDate: "2024-02-10" },
                { id: 5, name: "Keyboard Mechanical", price: 5999, stock: 15, category: "electronics", barcode: "5901234567897", addedDate: "2024-02-15" }
            ],
            notifications: [],
            currentInvoice: { template: "minimal", companyName: "", companyAddress: "", clientName: "", clientEmail: "", invoiceDate: new Date().toISOString().split('T')[0], dueDate: "", invoiceNumber: "", items: [], notes: "", subtotal: 0, tax: 0, total: 0 }
        };

        // ===== BARCODE SCANNER STATE =====
        let barcodeScanner = {
            isScanning: false,
            currentCamera: 'environment',
            quaggaInstance: null,
            currentModal: null,
            scannedBarcodes: []
        };

        let currentPage = 'dashboard';
        let currentTheme = 'light';
        let codeReader = null;
        let autoSaveTimeout = null;

        // ===== VALIDATION RULES =====
        const validationRules = {
            phone: {
                pattern: /^[6-9]\d{9}$/,
                message: 'Enter a valid 10-digit Indian mobile number'
            },
            email: {
                pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                message: 'Enter a valid email address'
            },
            upiId: {
                pattern: /^[a-zA-Z0-9.\-_]{2,49}@[a-zA-Z]{3,}$/,
                message: 'Enter a valid UPI ID (e.g., name@bank)'
            },
            ifscCode: {
                pattern: /^[A-Z]{4}0[A-Z0-9]{6}$/,
                message: 'Enter a valid 11-character IFSC code'
            },
            accountNo: {
                pattern: /^\d{9,18}$/,
                message: 'Account number should be 9-18 digits'
            },
            gstNo: {
                pattern: /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/,
                message: 'Enter a valid 15-character GST number'
            },
            pincode: {
                pattern: /^\d{6}$/,
                message: 'Enter a valid 6-digit pincode'
            }
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                initializeDashboard();
                loadSavedMerchantData();
                try {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                    console.log('ZXing initialized successfully');
                } catch(e) {
                    console.warn('ZXing not available, using Quagga fallback only');
                }
            }, 1000);
        });

        // ===== LOAD SAVED MERCHANT DATA =====
        function loadSavedMerchantData() {
            const savedData = localStorage.getItem('facepay_merchant_profile');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    dashboardState.merchant = { ...dashboardState.merchant, ...parsed };
                    
                    // Recalculate age if DOB exists
                    if (dashboardState.merchant.dateOfBirth) {
                        dashboardState.merchant.age = calculateAge(dashboardState.merchant.dateOfBirth);
                    }
                    
                    updateMerchantDisplay();
                    calculateProfileCompletion();
                } catch (e) {
                    console.error('Error loading saved data:', e);
                }
            }
        }

        // ===== CALCULATE AGE FROM DATE OF BIRTH =====
        function calculateAge(dob) {
            if (!dob) return 0;
            
            const birthDate = new Date(dob);
            const today = new Date();
            
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            return age;
        }

        // ===== CALCULATE PROFILE COMPLETION =====
        function calculateProfileCompletion() {
            const fields = [
                { name: 'dateOfBirth', weight: 10 },
                { name: 'phone', weight: 10 },
                { name: 'address', weight: 8 },
                { name: 'city', weight: 5 },
                { name: 'pincode', weight: 5 },
                { name: 'upiId', weight: 15 },
                { name: 'bankName', weight: 8 },
                { name: 'accountNo', weight: 8 },
                { name: 'ifscCode', weight: 8 },
                { name: 'gstNo', weight: 13, condition: () => dashboardState.merchant.isGstRegistered }
            ];

            let totalWeight = fields.reduce((sum, field) => sum + field.weight, 0);
            let completedWeight = 0;

            fields.forEach(field => {
                if (field.condition && !field.condition()) {
                    totalWeight -= field.weight;
                    return;
                }
                
                const value = dashboardState.merchant[field.name];
                if (value && value.toString().trim() !== '') {
                    completedWeight += field.weight;
                }
            });

            dashboardState.merchant.profileCompletionPercentage = totalWeight > 0 ? Math.round((completedWeight / totalWeight) * 100) : 0;
            dashboardState.merchant.profileCompleted = dashboardState.merchant.profileCompletionPercentage === 100;
            
            updateProfileCompletionUI();
            return dashboardState.merchant.profileCompletionPercentage;
        }

        // ===== UPDATE PROFILE COMPLETION UI =====
        function updateProfileCompletionUI() {
            const percentage = dashboardState.merchant.profileCompletionPercentage;
            
            // Update sidebar badge
            const badge = document.querySelector('.profile-completion-badge');
            if (badge) {
                badge.textContent = percentage + '%';
                if (percentage === 100) {
                    badge.classList.add('completed');
                } else {
                    badge.classList.remove('completed');
                }
            }
            
            // Update completion meter in profile page if it exists
            const completionFill = document.querySelector('.completion-fill');
            const completionText = document.querySelector('.completion-percentage');
            
            if (completionFill) {
                completionFill.style.width = percentage + '%';
            }
            
            if (completionText) {
                completionText.textContent = percentage + '% Complete';
            }
            
            // Update UPI ID in sidebar
            const upiElement = document.getElementById('sidebarUpiId');
            if (upiElement) {
                upiElement.textContent = dashboardState.merchant.upiId || 'Not set';
            }
            
            updateSectionStatuses();
        }

        // ===== UPDATE SECTION STATUSES =====
        function updateSectionStatuses() {
            const sections = {
                'basic': ['dateOfBirth', 'phone', 'address', 'city', 'pincode'],
                'payment': ['upiId'],
                'bank': ['bankName', 'accountNo', 'ifscCode'],
                'gst': ['gstNo']
            };

            Object.entries(sections).forEach(([sectionId, fields]) => {
                const statusElement = document.querySelector(`#section-${sectionId} .section-status`);
                if (!statusElement) return;

                const allFilled = fields.every(field => {
                    if (field === 'gstNo' && !dashboardState.merchant.isGstRegistered) return true;
                    const value = dashboardState.merchant[field];
                    return value && value.toString().trim() !== '';
                });

                if (allFilled) {
                    statusElement.textContent = 'Completed';
                    statusElement.classList.add('completed');
                } else {
                    statusElement.textContent = 'Pending';
                    statusElement.classList.remove('completed');
                }
            });
        }

        // ===== AUTO-SAVE FUNCTION =====
        function autoSaveProfile() {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(() => {
                saveMerchantProfile(true);
            }, 1000);
        }

        // ===== SAVE MERCHANT PROFILE =====
        function saveMerchantProfile(isAutoSave = false) {
            try {
                localStorage.setItem('facepay_merchant_profile', JSON.stringify(dashboardState.merchant));
                
                if (!isAutoSave) {
                    showToast('Profile saved successfully!', 'success');
                } else {
                    showSaveIndicator('saved');
                }
                
                updateMerchantDisplay();
                calculateProfileCompletion();
                
            } catch (e) {
                console.error('Error saving profile:', e);
                if (!isAutoSave) {
                    showToast('Error saving profile', 'error');
                }
            }
        }

        // ===== SHOW SAVE INDICATOR =====
        function showSaveIndicator(status) {
            const indicator = document.querySelector('.save-indicator');
            if (!indicator) return;
            
            if (status === 'saving') {
                indicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
                indicator.className = 'save-indicator saving';
            } else if (status === 'saved') {
                indicator.innerHTML = '<i class="fas fa-check-circle"></i> All changes saved';
                indicator.className = 'save-indicator saved';
                
                setTimeout(() => {
                    indicator.innerHTML = '<i class="fas fa-clock"></i> Auto-save enabled';
                    indicator.className = 'save-indicator';
                }, 2000);
            }
        }

        // ===== VALIDATE FIELD =====
        function validateField(fieldName, value) {
            const rule = validationRules[fieldName];
            if (!rule) return { valid: true, message: '' };
            
            const isValid = rule.pattern.test(value);
            return {
                valid: isValid,
                message: isValid ? '' : rule.message
            };
        }

        // ===== FORMAT FIELD VALUE =====
        function formatFieldValue(fieldName, value) {
            switch(fieldName) {
                case 'phone':
                    return value.replace(/\D/g, '').slice(0, 10);
                case 'accountNo':
                    return value.replace(/\D/g, '').slice(0, 18);
                case 'ifscCode':
                    return value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 11);
                case 'gstNo':
                    return value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 15);
                case 'pincode':
                    return value.replace(/\D/g, '').slice(0, 6);
                default:
                    return value;
            }
        }

        // ===== VERIFY GST NUMBER =====
        async function verifyGSTNumber(gstNo) {
            showToast('Verifying GST number...', 'info');
            
            // Simulate API call
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Demo verification - in production, call actual GST API
            const isValid = validationRules.gstNo.pattern.test(gstNo);
            
            if (isValid) {
                showToast('GST number verified successfully!', 'success');
                dashboardState.merchant.gstVerified = true;
                
                // Update verify button if it exists
                const verifyBtn = document.querySelector('.verify-btn');
                if (verifyBtn) {
                    verifyBtn.classList.add('verified');
                    verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verified';
                }
            } else {
                showToast('Invalid GST number', 'error');
                dashboardState.merchant.gstVerified = false;
                
                const verifyBtn = document.querySelector('.verify-btn');
                if (verifyBtn) {
                    verifyBtn.classList.remove('verified');
                    verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify';
                }
            }
            
            return isValid;
        }

        // ===== SHOW TOAST NOTIFICATION =====
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            
            let icon = 'info-circle';
            if (type === 'success') icon = 'check-circle';
            if (type === 'error') icon = 'exclamation-circle';
            if (type === 'warning') icon = 'exclamation-triangle';
            
            toast.innerHTML = `<i class="fas fa-${icon}"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== UPDATE MERCHANT DISPLAY =====
        function updateMerchantDisplay() {
            const merchantName = document.getElementById('merchantName');
            const merchantEmail = document.getElementById('merchantEmail');
            const upiId = document.getElementById('sidebarUpiId');
            
            if (merchantName) {
                merchantName.textContent = dashboardState.merchant.name;

            if (merchantEmail) {
                merchantEmail.textContent = dashboardState.merchant.email;
            }
            
            if (upiId) {

        }

        // ===== HANDLE DATE OF BIRTH CHANGE =====
        function handleDateOfBirthChange(value) {
            const dateOfBirth = value;
            const validationMsg = document.getElementById('dateOfBirth-validation');
            
            if (dateOfBirth) {
                const age = calculateAge(dateOfBirth);
                
                // Validate age (should be at least 18)
                if (age < 18) {
                    validationMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> You must be at least 18 years old';
                    validationMsg.className = 'validation-message error';
                    document.getElementById('ageDisplay').textContent = age;
                    document.getElementById('ageDisplay').parentElement.style.color = 'var(--error)';
                } else if (age > 100) {
                    validationMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter a valid date of birth';
                    validationMsg.className = 'validation-message error';
                } else {
                    validationMsg.innerHTML = '<i class="fas fa-check-circle"></i> Valid date of birth';
                    validationMsg.className = 'validation-message success';
                    document.getElementById('ageDisplay').parentElement.style.color = '';
                }
                
                document.getElementById('ageDisplay').textContent = age;
                
                // Save to state
                dashboardState.merchant.dateOfBirth = dateOfBirth;
                dashboardState.merchant.age = age;
                
                autoSaveProfile();
                calculateProfileCompletion();
            } else {
                validationMsg.innerHTML = '';
                document.getElementById('ageDisplay').textContent = '0';
            }
        }

        // ===== TOGGLE SECTION =====
        function toggleSection(sectionId) {
            const content = document.getElementById(`content-${sectionId}`);
            const allContents = document.querySelectorAll('.section-content');
            
            allContents.forEach(c => {
                if (c.id !== `content-${sectionId}`) {
                    c.classList.remove('active');
                }
            });
            
            content.classList.toggle('active');
        }

        // ===== TOGGLE GST FIELD =====
        function toggleGstField(isChecked) {
            const container = document.getElementById('gstFieldContainer');
            const statusElement = document.getElementById('gstSectionStatus');
            
            dashboardState.merchant.isGstRegistered = isChecked;
            
            if (isChecked) {
                container.classList.remove('hidden');
                // Don't auto-complete status until GST number is provided
                if (statusElement) {
                    statusElement.textContent = 'Pending';
                    statusElement.classList.remove('completed');
                }
            } else {
                container.classList.add('hidden');
                // Clear GST data
                dashboardState.merchant.gstNo = '';
                dashboardState.merchant.gstVerified = false;
                dashboardState.merchant.gstRegisteredName = '';
                
                const gstInput = document.getElementById('gstNo');
                if (gstInput) gstInput.value = '';
                
                const gstNameInput = document.getElementById('gstRegisteredName');
                if (gstNameInput) gstNameInput.value = '';
                
                // Reset verify button
                const verifyBtn = document.querySelector('.verify-btn');
                if (verifyBtn) {
                    verifyBtn.classList.remove('verified');
                    verifyBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Verify';
                }
                
                // Update status to completed (since GST not required)
                if (statusElement) {
                    statusElement.textContent = 'Completed';
                    statusElement.classList.add('completed');
                }
            }
            
            autoSaveProfile();
            updateSectionStatuses();
            calculateProfileCompletion();
        }

        // ===== HANDLE FIELD INPUT =====
        function handleFieldInput(fieldName, value) {
            const formattedValue = formatFieldValue(fieldName, value);
            const input = document.getElementById(fieldName);
            
            if (input && formattedValue !== value) {
                input.value = formattedValue;
            }
            
            // Real-time validation
            if (validationRules[fieldName]) {
                const validation = validateField(fieldName, formattedValue);
                const validationElement = document.getElementById(`${fieldName}-validation`);
                
                if (validationElement) {
                    if (formattedValue.length > 0) {
                        validationElement.innerHTML = validation.valid ? 
                            `<i class="fas fa-check-circle"></i> Valid` : 
                            `<i class="fas fa-exclamation-circle"></i> ${validation.message}`;
                        validationElement.className = `validation-message ${validation.valid ? 'success' : 'error'}`;
                    } else {
                        validationElement.innerHTML = '';
                    }
                }
                
                input.classList.toggle('valid', validation.valid && formattedValue.length > 0);
                input.classList.toggle('invalid', !validation.valid && formattedValue.length > 0);
            }
            
            // Auto-save
            autoSaveProfile();
        }

        // ===== VALIDATE AND SAVE FIELD =====
        function validateAndSaveField(fieldName, value) {
            const formattedValue = formatFieldValue(fieldName, value);
            
            if (validationRules[fieldName]) {
                const validation = validateField(fieldName, formattedValue);
                
                if (!validation.valid && formattedValue.length > 0) {
                    showToast(validation.message, 'error');
                    return;
                }
            }
            
            dashboardState.merchant[fieldName] = formattedValue;
            autoSaveProfile();
            calculateProfileCompletion();
        }

        // ===== VALIDATE CONFIRM ACCOUNT =====
        function validateConfirmAccount(value) {
            const accountNo = document.getElementById('accountNo').value;
            const validationMsg = document.getElementById('confirmAccount-validation');
            const input = document.getElementById('confirmAccountNo');
            
            if (value === accountNo && value.length > 0) {
                validationMsg.innerHTML = '<i class="fas fa-check-circle"></i> Account numbers match';
                validationMsg.className = 'validation-message success';
                input.classList.add('valid');
                input.classList.remove('invalid');
            } else if (value.length > 0) {
                validationMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Account numbers do not match';
                validationMsg.className = 'validation-message error';
                input.classList.add('invalid');
                input.classList.remove('valid');
            } else {
                validationMsg.innerHTML = '';
                input.classList.remove('valid', 'invalid');
            }
        }

        // ===== VERIFY GST =====
        async function verifyGST() {
            const gstNo = document.getElementById('gstNo').value;
            if (!gstNo) {
                showToast('Please enter GST number', 'error');
                return;
            }
            
            // Validate format first
            const validation = validateField('gstNo', gstNo);
            if (!validation.valid) {
                showToast(validation.message, 'error');
                return;
            }
            
            const isValid = await verifyGSTNumber(gstNo);
            if (isValid) {
                dashboardState.merchant.gstNo = gstNo;
                dashboardState.merchant.gstVerified = true;
                autoSaveProfile();
                calculateProfileCompletion();
            }
        }

        // ===== BARCODE IMAGE UPLOAD HANDLER =====
        function setupBarcodeImageUploadEvents() {
            const fileInput = document.getElementById('barcodeImageInput');
            const preview = document.getElementById('uploadPreview');
            const scanImageBtn = document.getElementById('scanImageBtn');
            const imageScanStatus = document.getElementById('imageScanStatus');

            if (!fileInput) {
                setTimeout(setupBarcodeImageUploadEvents, 100);
                return;
            }

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        preview.src = event.target.result;
                        preview.style.display = 'block';
                        scanImageBtn.style.display = 'block';
                        imageScanStatus.innerHTML = '';
                    };
                    reader.readAsDataURL(file);
                }
            });

            scanImageBtn.addEventListener('click', async function() {
                const file = fileInput.files[0];
                if (!file) {
                    imageScanStatus.innerHTML = '<span style="color: #fbbc04;"><i class="fas fa-exclamation-triangle"></i> Please select an image first</span>';
                    return;
                }

                imageScanStatus.innerHTML = '<span style="color: var(--primary);"><i class="fas fa-spinner fa-spin"></i> Scanning image...</span>';
                
                let barcode = null;
                
                // Try ZXing first
                if (codeReader) {
                    try {
                        barcode = await decodeBarcodeWithZXing(file);
                    } catch (zxError) {
                        console.log('ZXing failed:', zxError);
                    }
                }
                
                // Fallback to Quagga
                if (!barcode) {
                    try {
                        barcode = await decodeBarcodeWithQuagga(file);
                    } catch (quaggaError) {
                        console.log('Quagga failed:', quaggaError);
                    }
                }
                
                if (barcode) {
                    imageScanStatus.innerHTML = `<span style="color: var(--secondary);"><i class="fas fa-check-circle"></i> Barcode detected: ${barcode}</span>`;
                    handleDetectedBarcode(barcode, 'image-upload');
                    fileInput.value = '';
                    preview.style.display = 'none';
                    scanImageBtn.style.display = 'none';
                } else {
                    imageScanStatus.innerHTML = '<span style="color: #ea4335;"><i class="fas fa-times-circle"></i> No barcode found in image</span>';
                }
            });
        }

        // ZXing barcode decoder
        function decodeBarcodeWithZXing(file) {
            return new Promise((resolve, reject) => {
                if (!codeReader) {
                    reject('ZXing not available');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        codeReader.decodeFromImage(canvas).then(result => {
                            if (result && result.text) {
                                resolve(result.text);
                            } else {
                                reject('No barcode found');
                            }
                        }).catch(err => {
                            reject(err);
                        });
                    };
                    img.onerror = reject;
                };
                reader.readAsDataURL(file);
            });
        }

        // Quagga fallback decoder
        function decodeBarcodeWithQuagga(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    Quagga.decodeSingle({
                        decoder: {
                            readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader", "code_128_reader", "code_39_reader"]
                        },
                        locate: true,
                        src: e.target.result
                    }, function(result) {
                        if (result && result.codeResult) {
                            resolve(result.codeResult.code);
                        } else {
                            reject('No barcode found');
                        }
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        // ===== BARCODE SCANNER FUNCTIONS =====
        function openBarcodeScanner(sourceModal = null) {
            barcodeScanner.currentModal = sourceModal;
            barcodeScanner.scannedBarcodes = [];
            openModal('barcodeScannerModal');
            
            document.getElementById('scanResults').style.display = 'none';
            document.getElementById('productMatchInfo').style.display = 'none';
            document.getElementById('manualBarcode').value = '';
            
            const preview = document.getElementById('uploadPreview');
            const scanImageBtn = document.getElementById('scanImageBtn');
            const status = document.getElementById('imageScanStatus');
            const fileInput = document.getElementById('barcodeImageInput');
            if (preview) { preview.src = '#'; preview.style.display = 'none'; }
            if (scanImageBtn) scanImageBtn.style.display = 'none';
            if (status) status.innerHTML = '';
            if (fileInput) fileInput.value = '';
            
            setTimeout(() => { startRealBarcodeScanner(); }, 300);
        }

        async function startRealBarcodeScanner() {
            try {
                const videoContainer = document.getElementById('interactive');
                barcodeScanner.quaggaInstance = Quagga;
                
                await Quagga.init({
                    inputStream: { 
                        name: "Live", 
                        type: "LiveStream", 
                        target: videoContainer, 
                        constraints: { 
                            width: { min: 640 }, 
                            height: { min: 480 }, 
                            aspectRatio: { ideal: 1.333 }, 
                            facingMode: barcodeScanner.currentCamera 
                        } 
                    },
                    decoder: { 
                        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader"], 
                        multiple: false 
                    },
                    locate: true, 
                    numOfWorkers: navigator.hardwareConcurrency || 4, 
                    frequency: 10
                }, function(err) {
                    if (err) { 
                        showToast('Scanner failed. Please try again.', 'error'); 
                        startFallbackCamera(); 
                        return; 
                    }
                    Quagga.start(); 
                    barcodeScanner.isScanning = true;
                    const startBtn = document.getElementById('startScannerBtn');
                    if (startBtn) startBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
                    
                    Quagga.onDetected(function(result) {
                        if (result && result.codeResult && barcodeScanner.isScanning) {
                            const barcode = result.codeResult.code;
                            pauseBarcodeScanner();
                            handleDetectedBarcode(barcode, result.codeResult.format);
                        }
                    });
                });
            } catch (error) { 
                showToast('Failed to access camera.', 'error'); 
                startFallbackCamera(); 
            }
        }

        function startFallbackCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: barcodeScanner.currentCamera, width: { ideal: 1280 }, height: { ideal: 720 } } })
                .then(stream => {
                    const videoContainer = document.getElementById('interactive'); 
                    videoContainer.innerHTML = '';
                    const video = document.createElement('video'); 
                    video.srcObject = stream; 
                    video.autoplay = true; 
                    video.playsInline = true;
                    video.style.width = '100%'; 
                    video.style.height = '100%'; 
                    video.style.objectFit = 'cover';
                    videoContainer.appendChild(video);
                    setTimeout(() => { if (barcodeScanner.isScanning) simulateBarcodeDetection(); }, 2000);
                }).catch(() => { showToast('Camera access denied.', 'error'); });
        }

        function pauseBarcodeScanner() { 
            if (barcodeScanner.quaggaInstance && barcodeScanner.isScanning) { 
                barcodeScanner.quaggaInstance.stop(); 
                barcodeScanner.isScanning = false; 
                const startBtn = document.getElementById('startScannerBtn');
                if (startBtn) startBtn.innerHTML = '<i class="fas fa-play"></i> Resume'; 
            } 
        }
        
        function resumeBarcodeScanner() { 
            if (barcodeScanner.quaggaInstance && !barcodeScanner.isScanning) { 
                barcodeScanner.quaggaInstance.start(); 
                barcodeScanner.isScanning = true; 
                const startBtn = document.getElementById('startScannerBtn');
                if (startBtn) startBtn.innerHTML = '<i class="fas fa-pause"></i> Pause'; 
            } 
        }
        
        function stopBarcodeScanner() {
            if (barcodeScanner.quaggaInstance) { 
                barcodeScanner.quaggaInstance.stop(); 
                barcodeScanner.quaggaInstance = null; 
            }
            const videoContainer = document.getElementById('interactive');
            Array.from(videoContainer.getElementsByTagName('video')).forEach(video => { 
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop()); 
            });
            videoContainer.innerHTML = ''; 
            barcodeScanner.isScanning = false;
            const startBtn = document.getElementById('startScannerBtn');
            if (startBtn) startBtn.innerHTML = '<i class="fas fa-play"></i> Start Scanner';
        }
        
        function switchCamera() { 
            barcodeScanner.currentCamera = barcodeScanner.currentCamera === 'environment' ? 'user' : 'environment'; 
            showToast(`Switched to ${barcodeScanner.currentCamera === 'environment' ? 'rear' : 'front'} camera`, 'info'); 
            stopBarcodeScanner(); 
            setTimeout(() => { startRealBarcodeScanner(); }, 500); 
        }

        // ===== BARCODE DETECTION HANDLER =====
        function handleDetectedBarcode(barcode, format) {
            console.log(`Barcode detected: ${barcode} (${format})`);
            
            if (!barcode || barcode === 'CAMERA-BLOCKED') { 
                resumeBarcodeScanner(); 
                return; 
            }
            
            barcodeScanner.scannedBarcodes.push({ 
                code: barcode, 
                format: format, 
                timestamp: new Date().toISOString() 
            });
            
            document.getElementById('scanResults').style.display = 'block';
            document.getElementById('scannedBarcode').textContent = barcode;
            
            const existingProduct = dashboardState.products.find(p => p.barcode === barcode);
            
            if (existingProduct) {
                document.getElementById('productMatchInfo').style.display = 'block';
                document.getElementById('matchedProductName').textContent = existingProduct.name;
                document.getElementById('matchedProductPrice').textContent = existingProduct.price.toLocaleString();
                document.getElementById('matchedProductStock').textContent = existingProduct.stock;
                showToast(`✅ Found: ${existingProduct.name}`, 'success');
            } else {
                document.getElementById('productMatchInfo').style.display = 'none';
                showToast(`📦 New product detected: ${barcode}`, 'warning');
            }
            playScanSound();
        }

        function useScannedBarcode() {
            const barcode = document.getElementById('scannedBarcode').textContent;
            
            if (barcodeScanner.currentModal === 'addProductModal') {
                document.getElementById('productBarcode').value = barcode;
                closeModal('barcodeScannerModal'); 
                openModal('addProductModal');
            } else {
                openModal('addProductModal');
                document.getElementById('productBarcode').value = barcode;
                document.getElementById('productName').focus();
                closeModal('barcodeScannerModal');
            }
            barcodeScanner.currentModal = null;
        }

        function scanAnother() { 
            document.getElementById('scanResults').style.display = 'none'; 
            resumeBarcodeScanner(); 
        }
        
        function playScanSound() {
            try { 
                const audioContext = new (window.AudioContext || window.webkitAudioContext)(); 
                const oscillator = audioContext.createOscillator(); 
                const gainNode = audioContext.createGain(); 
                oscillator.connect(gainNode); 
                gainNode.connect(audioContext.destination); 
                oscillator.frequency.value = 800; 
                oscillator.type = 'sine'; 
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1); 
                oscillator.start(audioContext.currentTime); 
                oscillator.stop(audioContext.currentTime + 0.1); 
            } catch(e) {}
        }
        
        function simulateBarcodeDetection() {
            if (!barcodeScanner.isScanning) return;
            const demoBarcodes = [
                { code: '8901234567890', name: 'Laptop Pro', price: 89999 }, 
                { code: '123456789012', name: 'Wireless Mouse', price: 1999 }, 
                { code: '978020137962', name: 'Office Chair', price: 12999 }
            ];
            const randomBarcode = demoBarcodes[Math.floor(Math.random() * demoBarcodes.length)];
            pauseBarcodeScanner();
            handleDetectedBarcode(randomBarcode.code, 'demo');
        }

        // ===== PRODUCT MANAGEMENT =====
        function addProduct(e) {
            e.preventDefault();
            
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            const category = document.getElementById('productCategory').value;
            const barcode = document.getElementById('productBarcode').value;
            
            if (!name || !price || !stock) { 
                showToast('Please fill all required fields', 'error'); 
                return; 
            }
            
            const newProduct = { 
                id: dashboardState.products.length + 1, 
                name: name, 
                price: price, 
                stock: stock, 
                category: category, 
                barcode: barcode || null, 
                addedDate: new Date().toISOString().split('T')[0] 
            };
            
            dashboardState.products.push(newProduct); 
            closeModal('addProductModal'); 
            showToast(`Product "${name}" added successfully!`, 'success');
            
            document.getElementById('addProductForm').reset(); 
            resetAddProductForm();
            updateBadgeCounts();
            
            if (currentPage === 'dashboard' || currentPage === 'products') {
                navigateToPage(currentPage);
            }
        }

        function editProduct(productId) {
            const product = dashboardState.products.find(p => p.id === productId); 
            if (!product) return;
            
            document.getElementById('productName').value = product.name; 
            document.getElementById('productPrice').value = product.price; 
            document.getElementById('productStock').value = product.stock; 
            document.getElementById('productCategory').value = product.category; 
            document.getElementById('productBarcode').value = product.barcode || '';
            
            const form = document.getElementById('addProductForm');
            const submitBtn = document.getElementById('addProductSubmitBtn');
            const title = document.getElementById('addProductModalTitle');
            
            // Remove any existing submit handler
            form.onsubmit = null;
            
            // Set new submit handler
            form.onsubmit = function(e) { 
                e.preventDefault(); 
                updateProduct(productId); 
            };
            
            if (submitBtn) submitBtn.textContent = 'Update Product';
            if (title) title.textContent = 'Edit Product';
            
            openModal('addProductModal');
        }

        function updateProduct(productId) {
            const productIndex = dashboardState.products.findIndex(p => p.id === productId); 
            if (productIndex === -1) return;
            
            dashboardState.products[productIndex] = { 
                ...dashboardState.products[productIndex], 
                name: document.getElementById('productName').value, 
                price: parseFloat(document.getElementById('productPrice').value), 
                stock: parseInt(document.getElementById('productStock').value), 
                category: document.getElementById('productCategory').value, 
                barcode: document.getElementById('productBarcode').value || null 
            };
            
            closeModal('addProductModal'); 
            showToast('Product updated successfully!', 'success');
            resetAddProductForm();
            
            if (currentPage === 'dashboard' || currentPage === 'products') {
                navigateToPage(currentPage);
            }
        }

        function deleteProduct(productId) { 
            if (!confirm('Are you sure you want to delete this product?')) return; 
            dashboardState.products = dashboardState.products.filter(p => p.id !== productId); 
            showToast('Product deleted successfully!', 'success'); 
            updateBadgeCounts(); 
            if (currentPage === 'products') loadProductsPage(); 
            else if (currentPage === 'dashboard') loadDashboardContent();
        }

        // ===== UTILITY FUNCTIONS =====
        function openModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) { 
                modal.classList.add('active'); 
                document.body.style.overflow = 'hidden'; 
            } 
        }
        
        function closeModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) { 
                modal.classList.remove('active'); 
            } 
            document.body.style.overflow = ''; 
            if (modalId === 'barcodeScannerModal') stopBarcodeScanner(); 
        }
        
        function copyToClipboard(elementId) { 
            const text = document.getElementById(elementId).textContent; 
            navigator.clipboard.writeText(text).then(() => showToast('Barcode copied to clipboard!', 'success')); 
        }
        
        function updateBadgeCounts() { 
            const productCount = document.getElementById('productCount'); 
            if (productCount) productCount.textContent = dashboardState.products.length; 
        }
        
        function setupSearch() {
            const searchInput = document.getElementById('globalSearch'); 
            if (!searchInput) return;
            
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                if (currentPage === 'products') { 
                    document.querySelectorAll('#productsTable tr').forEach(row => { 
                        const text = row.textContent.toLowerCase(); 
                        row.style.display = text.includes(searchTerm) ? '' : 'none'; 
                    }); 
                } else if (currentPage === 'dashboard') { 
                    document.querySelectorAll('#dashboardProducts tr').forEach(row => { 
                        const text = row.textContent.toLowerCase(); 
                        row.style.display = text.includes(searchTerm) ? '' : 'none'; 
                    }); 
                }
            });
        }

        function setupBarcodeScannerEvents() {
            const startBtn = document.getElementById('startScannerBtn'); 
            if (startBtn) startBtn.addEventListener('click', function() { 
                if (!barcodeScanner.isScanning) startRealBarcodeScanner(); 
                else pauseBarcodeScanner(); 
            });
            
            const stopBtn = document.getElementById('stopScannerBtn'); 
            if (stopBtn) stopBtn.addEventListener('click', stopBarcodeScanner);
            
            const switchBtn = document.getElementById('switchCameraBtn'); 
            if (switchBtn) switchBtn.addEventListener('click', switchCamera);
            
            const manualBtn = document.getElementById('useManualBarcode'); 
            if (manualBtn) manualBtn.addEventListener('click', function() { 
                const manualInput = document.getElementById('manualBarcode'); 
                if (manualInput) { 
                    const manualBarcode = manualInput.value.trim(); 
                    if (manualBarcode && manualBarcode.length >= 8) {
                        handleDetectedBarcode(manualBarcode, 'manual'); 
                    } else { 
                        showToast('Please enter a valid barcode (min 8 digits)', 'error'); 
                    } 
                } 
            });
            
            const manualInput = document.getElementById('manualBarcode'); 
            if (manualInput) manualInput.addEventListener('keypress', function(e) { 
                if (e.key === 'Enter') document.getElementById('useManualBarcode')?.click(); 
            });
        }

        function setupEventListeners() {
            document.getElementById('menuToggle')?.addEventListener('click', function() { 
                document.querySelector('.sidebar').classList.toggle('active'); 
            });
            
            document.getElementById('themeToggle')?.addEventListener('click', function() { 
                currentTheme = currentTheme === 'light' ? 'dark' : 'light'; 
                document.documentElement.setAttribute('data-theme', currentTheme); 
                this.innerHTML = currentTheme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>'; 
            });
            
            document.getElementById('logoutBtn')?.addEventListener('click', function(e) { 
                e.preventDefault(); 
                if (confirm('Are you sure you want to logout?')) showToast('Logged out successfully!', 'success'); 
            });
            
            document.querySelectorAll('.modal-close').forEach(button => { 
                button.addEventListener('click', function() { 
                    const modal = this.closest('.modal'); 
                    if (modal) closeModal(modal.id); 
                }); 
            });
            
            document.querySelectorAll('.modal').forEach(modal => { 
                modal.addEventListener('click', function(e) { 
                    if (e.target === this) closeModal(this.id); 
                }); 
            });
            
            document.querySelectorAll('.nav-item[data-page]').forEach(item => { 
                item.addEventListener('click', function(e) { 
                    e.preventDefault(); 
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active')); 
                    this.classList.add('active'); 
                    const page = this.getAttribute('data-page'); 
                    navigateToPage(page); 
                    if (window.innerWidth <= 1024) document.querySelector('.sidebar').classList.remove('active'); 
                }); 
            });
            
            document.getElementById('addProductForm')?.addEventListener('submit', addProduct);
            
            setupBarcodeScannerEvents();
        }
    </script>
