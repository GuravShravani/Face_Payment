<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, itial-scale=1.0">
    <title>FacePay Merchant - Barcode Scanner</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QuaggaJS for Barcode Scanning -->
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <!-- ZXing Browser - Reliable barcode decoder for images -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        /* ===== FACE PAY THEME ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --secondary: #34a853;
            --light-gray: #f8f9fa;
            --medium-gray: #e8eaed;
            --dark-gray: #5f6368;
            --text: #202124;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #1a73e8 0%, #34a853 100%);
        }
        [data-theme="dark"] {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --secondary: #34a853;
            --light-gray: #2d2d2d;
            --medium-gray: #3c4043;
            --dark-gray: #bdc1c6;
            --text: #e8eaed;
            --white: #202124;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        body { background-color: #f5f7fa; color: var(--text); line-height: 1.6; overflow-x: hidden; transition: background-color 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--gradient); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-size: 20px; z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .dashboard-container { display: flex; min-height: 100vh; opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px; background: var(--white); border-right: 1px solid var(--medium-gray);
            display: flex; flex-direction: column; transition: all 0.3s;
            position: fixed; height: 100vh; z-index: 100;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--medium-gray); display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--primary); }
        .logo i { font-size: 28px; color: var(--primary); }
        .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--dark-gray); cursor: pointer; padding: 5px; }
        
        .merchant-profile { padding: 20px; border-bottom: 1px solid var(--medium-gray); display: flex; align-items: center; gap: 15px; }
        .profile-avatar i { font-size: 50px; color: var(--primary); }
        .profile-info h3 { font-size: 16px; margin-bottom: 5px; }
        .profile-info p { font-size: 14px; color: var(--dark-gray); margin-bottom: 8px; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-dot { width: 8px; height: 8px; background: var(--secondary); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .sidebar-nav { flex: 1; padding: 20px 0; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .nav-item { margin: 5px 15px; border-radius: 8px; overflow: hidden; }
        .nav-item a { display: flex; align-items: center; padding: 12px 15px; color: var(--dark-gray); text-decoration: none; transition: all 0.3s; gap: 12px; }
        .nav-item a i { width: 20px; text-align: center; font-size: 18px; }
        .nav-item.active a { background: var(--primary); color: white; }
        .nav-item:hover:not(.active) a { background: var(--light-gray); color: var(--text); }
        .badge { margin-left: auto; background: var(--secondary); color: white; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--medium-gray); }
        .upi-info { display: flex; align-items: center; gap: 10px; padding: 15px; background: var(--light-gray); border-radius: 8px; margin-bottom: 15px; }
        .upi-info i { font-size: 24px; color: var(--primary); }
        .upi-info p { font-size: 12px; color: var(--dark-gray); }
        .upi-info strong { font-size: 14px; color: var(--text); }
        .logout-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .logout-btn:hover { background: var(--primary-dark); }
        
        /* ===== MAIN CONTENT ===== */
        .main-content { flex: 1; margin-left: 280px; transition: margin 0.3s; }
        .top-header {
            padding: 20px 30px; background: var(--white); border-bottom: 1px solid var(--medium-gray);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;
        }
        .header-left h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; }
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dark-gray); }
        .breadcrumb i { font-size: 12px; }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--dark-gray); }
        .search-box input { 
            width: 300px; padding: 10px 15px 10px 45px; 
            border: 1px solid var(--medium-gray); border-radius: 6px; 
            background: var(--light-gray); color: var(--text); font-size: 14px; 
            transition: all 0.3s;
        }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .header-actions { display: flex; gap: 10px; }
        .header-btn { 
            width: 40px; height: 40px; border-radius: 50%; border: none; 
            background: var(--light-gray); color: var(--text); font-size: 18px; 
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .header-btn:hover { background: var(--primary); color: white; }
        .notification-badge { position: absolute; top: -5px; right: -5px; background: var(--secondary); color: white; font-size: 12px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .content-area { padding: 30px; min-height: calc(100vh - 120px); }
        
        /* ===== CARDS & TABLES ===== */
        .welcome-message { 
            background: var(--gradient); color: white; padding: 40px; 
            border-radius: 12px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 30px; animation: slideUp 0.5s ease; 
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .welcome-text h2 { font-size: 32px; margin-bottom: 10px; }
        .welcome-text p { font-size: 16px; opacity: 0.9; max-width: 600px; }
        .welcome-illustration i { font-size: 120px; opacity: 0.2; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--white); padding: 25px; border-radius: 8px; 
            box-shadow: var(--shadow); transition: all 0.3s; border-left: 4px solid var(--primary); 
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
        .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .stat-header i { font-size: 24px; color: var(--primary); }
        .stat-title { font-size: 14px; color: var(--dark-gray); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .stat-change { font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .stat-change.positive { color: var(--secondary); }
        .stat-change.negative { color: #ea4335; }
        
        .table-container { 
            background: var(--white); border-radius: 8px; box-shadow: var(--shadow); 
            overflow: hidden; margin-bottom: 30px; 
        }
        .table-header { 
            padding: 20px; border-bottom: 1px solid var(--medium-gray); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .table-header h3 { font-size: 18px; font-weight: 600; }
        .table-actions { display: flex; gap: 10px; }
        
        .btn-primary, .btn-secondary, .btn-icon { 
            padding: 8px 16px; border-radius: 6px; border: none; 
            font-size: 14px; font-weight: 500; cursor: pointer; 
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; 
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--light-gray); color: var(--text); }
        .btn-secondary:hover { background: var(--medium-gray); }
        .btn-icon { 
            width: 36px; height: 36px; padding: 0; justify-content: center; 
            background: var(--light-gray); color: var(--text); 
        }
        .btn-icon:hover { background: var(--primary); color: white; }
        
        .table { width: 100%; border-collapse: collapse; }
        .table th { 
            background: var(--light-gray); padding: 15px; text-align: left; 
            font-weight: 600; color: var(--dark-gray); font-size: 14px; 
            border-bottom: 1px solid var(--medium-gray); 
        }
        .table td { padding: 15px; border-bottom: 1px solid var(--medium-gray); }
        .table tr:last-child td { border-bottom: none; }
        .table tr:hover td { background: var(--light-gray); }
        
        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status.paid { background: #d1fae5; color: #065f46; }
        .status.pending { background: #fef3c7; color: #92400e; }
        .status.failed { background: #fee2e2; color: #991b1b; }
        
        /* ===== FORMS ===== */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text); }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px 15px; 
            border: 1px solid var(--medium-gray); border-radius: 6px; 
            background: var(--light-gray); color: var(--text); font-size: 14px; 
            transition: all 0.3s; 
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); 
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* ===== MODALS ===== */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: var(--white); border-radius: 12px; width: 90%; max-width: 800px; 
            max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
            animation: modalSlide 0.3s ease; 
        }
        @keyframes modalSlide { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { 
            padding: 20px; border-bottom: 1px solid var(--medium-gray); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .modal-header h3 { font-size: 20px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 24px; color: var(--dark-gray); cursor: pointer; padding: 5px; }
        .modal-body { padding: 20px; }
        .modal-footer { 
            padding: 20px; border-top: 1px solid var(--medium-gray); 
            display: flex; justify-content: flex-end; gap: 10px; 
        }
        
        /* ===== SCANNER ===== */
        .scanner-container { display: flex; flex-direction: column; gap: 20px; }
        .scanner-viewport { 
            position: relative; width: 100%; height: 300px; 
            background: #000; border-radius: 8px; overflow: hidden; 
        }
        #interactive.viewport { position: relative; width: 100%; height: 300px; overflow: hidden; background: #000; border-radius: 8px; }
        #interactive.viewport canvas, #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        #interactive.viewport canvas.drawingBuffer { position: absolute; top: 0; left: 0; z-index: 2; }
        .scanner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .scanning-line { 
            position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; 
            background: rgba(26,115,232,0.8); box-shadow: 0 0 10px rgba(26,115,232,0.5); 
            animation: scanLine 2s infinite linear; 
        }
        @keyframes scanLine { 0%,100% { top: 20%; } 50% { top: 80%; } }
        .scanner-controls { display: flex; flex-direction: column; gap: 15px; }
        .scanner-info { 
            background: var(--light-gray); padding: 12px; border-radius: 6px; 
            text-align: center; font-size: 14px; 
        }
        .scanner-info i { color: var(--primary); margin-right: 8px; }
        .scanner-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .manual-input { 
            margin-top: 20px; padding: 15px; background: var(--light-gray); 
            border-radius: 6px; 
        }
        .barcode-image-upload { 
            margin-top: 20px; padding: 20px; background: var(--white); 
            border: 2px dashed var(--primary); border-radius: 8px; text-align: center; 
        }
        .upload-area { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .upload-btn { 
            background: var(--primary); color: white; padding: 10px 20px; 
            border-radius: 6px; cursor: pointer; transition: all 0.3s; 
            border: none; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; 
        }
        .upload-btn:hover { background: var(--primary-dark); }
        #uploadPreview { max-width: 100%; max-height: 150px; border-radius: 6px; margin-top: 10px; display: none; border: 2px solid var(--primary); }
        #scanImageBtn { margin-top: 15px; width: 100%; display: none; }
        #imageScanStatus { margin-top: 10px; font-size: 14px; font-weight: 500; min-height: 24px; }
        .scan-results { background: var(--light-gray); padding: 20px; border-radius: 6px; }
        .barcode-result { 
            display: flex; align-items: center; justify-content: space-between; 
            background: var(--white); padding: 15px; border-radius: 6px; 
            margin: 10px 0; border: 2px solid var(--primary); 
        }
        .barcode-result span { font-family: monospace; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
        
        .stock-indicator { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .stock-indicator.low { background: #fee2e2; color: #991b1b; }
        .stock-indicator.medium { background: #fef3c7; color: #92400e; }
        .stock-indicator.high { background: #d1fae5; color: #065f46; }
        .category-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #e8f0fe; color: var(--primary); }
        
        .notification-toast { 
            position: fixed; top: 20px; right: 20px; padding: 15px 20px; 
            background: var(--primary); color: white; border-radius: 6px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; 
            gap: 10px; z-index: 3000; animation: slideInRight 0.3s ease; 
        }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .notification-toast.success { background: var(--secondary); }
        .notification-toast.error { background: #ea4335; }
        .notification-toast.warning { background: #fbbc04; }
        
        @media (max-width: 1200px) { 
            .sidebar { transform: translateX(-100%); } 
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; } 
            .menu-toggle { display: block; } 
            .search-box input { width: 200px; } 
        }
        @media (max-width: 768px) { 
            .top-header { flex-direction: column; gap: 15px; padding: 15px; } 
            .header-right { width: 100%; justify-content: space-between; } 
            .search-box input { width: 100%; } 
            .content-area { padding: 15px; } 
            .welcome-message { flex-direction: column; text-align: center; padding: 30px 20px; } 
            .welcome-illustration i { font-size: 80px; margin-top: 20px; } 
            .form-row { grid-template-columns: 1fr; } 
            .stats-grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>
    <!-- Initial Loading Screen -->
    <div id="loading">
        <div class="loading-spinner"></div>
        <p>Loading Merchant Dashboard...</p>
    </div>
    
    <!-- Main App Container -->
    <div id="app"></div>

    <script>
        // ===== DASHBOARD STATE =====
        let dashboardState = {
            merchant: { name: "Facepay| The Future Of Payments", email: "business@facepaysolution.com", upiId: "facepaysolutions@upi", phone: "+91 9876543210", address: "123 Business Street, Pune City, India Country" },
            stats: { totalRevenue: 125000, pendingInvoices: 5, totalProducts: 24, recentTransactions: 8 },
            products: [
                { id: 1, name: "Laptop Pro", price: 89999, stock: 12, category: "electronics", barcode: "8901234567890", addedDate: "2024-01-15" },
                { id: 2, name: "Wireless Mouse", price: 1999, stock: 45, category: "electronics", barcode: "123456789012", addedDate: "2024-01-20" },
                { id: 3, name: "Office Chair", price: 12999, stock: 8, category: "furniture", barcode: "978020137962", addedDate: "2024-02-01" },
                { id: 4, name: "Webcam HD", price: 3499, stock: 23, category: "electronics", barcode: "4006381333931", addedDate: "2024-02-10" },
                { id: 5, name: "Keyboard Mechanical", price: 5999, stock: 15, category: "electronics", barcode: "5901234567897", addedDate: "2024-02-15" }
            ],
            notifications: [],
            currentInvoice: { template: "minimal", companyName: "", companyAddress: "", clientName: "", clientEmail: "", invoiceDate: new Date().toISOString().split('T')[0], dueDate: "", invoiceNumber: "", items: [], notes: "", subtotal: 0, tax: 0, total: 0 }
        };

        // ===== BARCODE SCANNER STATE =====
        let barcodeScanner = {
            isScanning: false,
            currentCamera: 'environment',
            quaggaInstance: null,
            currentModal: null,
            scannedBarcodes: []
        };

        let currentPage = 'dashboard';
        let currentTheme = 'light';
        let codeReader = null;

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                initializeDashboard();
                try {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                    console.log('ZXing initialized successfully');
                } catch(e) {
                    console.warn('ZXing not available, using Quagga fallback only');
                }
            }, 1000);
        });

        function initializeDashboard() {
            const appContainer = document.getElementById('app');
            appContainer.innerHTML = `
                <div class="dashboard-container">
                    <aside class="sidebar">
                        <div class="sidebar-header">
                            <div class="logo"><i class="fas fa-face-smile"></i><h2>Face<span style="color:var(--primary)">Pay</span></h2></div>
                            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                        </div>
                        <div class="merchant-profile">
                            <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
                            <div class="profile-info">
                                <h3 id="merchantName">${dashboardState.merchant.name}</h3>
                                <p id="merchantEmail">${dashboardState.merchant.email}</p>
                                <div class="status-indicator"><span class="status-dot"></span><span>Online</span></div>
                            </div>
                        </div>
                        <nav class="sidebar-nav">
                            <ul>
                                <li class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" data-page="dashboard"><a href="#"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
                                <li class="nav-item ${currentPage === 'products' ? 'active' : ''}" data-page="products"><a href="#"><i class="fas fa-box-open"></i><span>Products</span><span class="badge" id="productCount">${dashboardState.products.length}</span></a></li>
                                <li class="nav-item ${currentPage === 'add-product' ? 'active' : ''}" data-page="add-product"><a href="#"><i class="fas fa-plus-circle"></i><span>Add Product</span></a></li>
                                <li class="nav-item ${currentPage === 'transactions' ? 'active' : ''}" data-page="transactions"><a href="#"><i class="fas fa-history"></i><span>Transactions</span></a></li>
                                <li class="nav-item" data-page="invoices"><a href="../src/newwww.html"><i class="fas fa-file-invoice"></i><span>Invoices</span></a></li>
                                <li class="nav-item" data-page="balance-sheet"><a href="balance_sheet.html"><i class="fas fa-balance-scale"></i><span>Balance Sheet</span></a></li>
                            </ul>
                        </nav>
                        <div class="sidebar-footer">
                            <div class="upi-info"><i class="fas fa-qrcode"></i><div><p>UPI ID</p><strong id="upiId">${dashboardState.merchant.upiId}</strong></div></div>
                            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
                        </div>
                    </aside>
                    <main class="main-content">
                        <header class="top-header">
                            <div class="header-left"><h1 id="pageTitle">Dashboard</h1><div class="breadcrumb"><span>Home</span><i class="fas fa-chevron-right"></i><span id="currentPage">Dashboard</span></div></div>
                            <div class="header-right">
                                <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Search products..." id="globalSearch"></div>
                                <div class="header-actions"><button class="header-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button></div>
                            </div>
                        </header>
                        <div class="content-area" id="contentArea"></div>
                    </main>
                </div>
                <!-- Add Product Modal -->
                <div class="modal" id="addProductModal">
                    <div class="modal-content">
                        <div class="modal-header"><h3 id="addProductModalTitle">Add New Product</h3><button class="modal-close">&times;</button></div>
                        <div class="modal-body">
                            <form id="addProductForm">
                                <div class="form-group"><label for="productName">Product Name *</label><input type="text" id="productName" required></div>

        // ===== BARCODE IMAGE UPLOAD HANDLER =====
        function setupBarcodeImageUploadEvents() {
            const fileInput = document.getElementById('barcodeImageInput');
            const preview = document.getElementById('uploadPreview');
            const scanImageBtn = document.getElementById('scanImageBtn');
            const imageScanStatus = document.getElementById('imageScanStatus');

            if (!fileInput) {
                setTimeout(setupBarcodeImageUploadEvents, 100);
                return;
            }

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        preview.src = event.target.result;
                        preview.style.display = 'block';
                        scanImageBtn.style.display = 'block';
                        imageScanStatus.innerHTML = '';
                    };
                    reader.readAsDataURL(file);
                }
            });

            scanImageBtn.addEventListener('click', async function() {
                const file = fileInput.files[0];
                if (!file) {
                    imageScanStatus.innerHTML = '<span style="color: #fbbc04;"><i class="fas fa-exclamation-triangle"></i> Please select an image first</span>';
                    return;
                }

                imageScanStatus.innerHTML = '<span style="color: var(--primary);"><i class="fas fa-spinner fa-spin"></i> Scanning image...</span>';
                
                let barcode = null;
                
                // Try ZXing first
                if (codeReader) {
                    try {
                        barcode = await decodeBarcodeWithZXing(file);
                    } catch (zxError) {
                        console.log('ZXing failed:', zxError);
                    }
                }
                
                // Fallback to Quagga
                if (!barcode) {
                    try {
                        barcode = await decodeBarcodeWithQuagga(file);
                    } catch (quaggaError) {
                        console.log('Quagga failed:', quaggaError);
                    }
                }
                
                if (barcode) {
                    imageScanStatus.innerHTML = `<span style="color: var(--secondary);"><i class="fas fa-check-circle"></i> Barcode detected: ${barcode}</span>`;
                    handleDetectedBarcode(barcode, 'image-upload');
                    fileInput.value = '';
                    preview.style.display = 'none';
                    scanImageBtn.style.display = 'none';
                } else {
                    imageScanStatus.innerHTML = '<span style="color: #ea4335;"><i class="fas fa-times-circle"></i> No barcode found in image</span>';
                }
            });
        }

        // ZXing barcode decoder
        function decodeBarcodeWithZXing(file) {
            return new Promise((resolve, reject) => {
                if (!codeReader) {
                    reject('ZXing not available');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        codeReader.decodeFromImage(canvas).then(result => {
                            if (result && result.text) {
                                resolve(result.text);
                            } else {
                                reject('No barcode found');
                            }
                        }).catch(err => {
                            reject(err);
                        });
                    };
                    img.onerror = reject;
                };
                reader.readAsDataURL(file);
            });
        }

        // Quagga fallback decoder
        function decodeBarcodeWithQuagga(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    Quagga.decodeSingle({
                        decoder: {
                            readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader", "code_128_reader", "code_39_reader"]
                        },
                        locate: true,
                        src: e.target.result
                    }, function(result) {
                        if (result && result.codeResult) {
                            resolve(result.codeResult.code);
                        } else {
                            reject('No barcode found');
                        }
                    });
                };
                reader.readAsDataURL(file);
            });
        }

        // ===== BARCODE SCANNER FUNCTIONS =====
        function openBarcodeScanner(sourceModal = null) {
            barcodeScanner.currentModal = sourceModal;

        async function startRealBarcodeScanner() {
            try {
                const videoContainer = document.getElementById('interactive');
                barcodeScanner.quaggaInstance = Quagga;
                
                await Quagga.init({
                    inputStream: { 
                        name: "Live", 
                        type: "LiveStream", 
                        target: videoContainer, 
                        constraints: { 
                            width: { min: 640 }, 
                            height: { min: 480 }, 
                            aspectRatio: { ideal: 1.333 }, 
                            facingMode: barcodeScanner.currentCamera 
                        } 
                    },
                    decoder: { 
                        readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader"], 
                        multiple: false 
                    },
                    locate: true, 
                    numOfWorkers: navigator.hardwareConcurrency || 4, 
                    frequency: 10
                }, function(err) {
                    if (err) { 
                        showNotification('Scanner failed. Please try again.', 'error'); 
                        startFallbackCamera(); 
                        return; 
                    }
                    Quagga.start(); 
                    barcodeScanner.isScanning = true;
                    const startBtn = document.getElementById('startScannerBtn');
                    if (startBtn) startBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
                    
                    Quagga.onDetected(function(result) {
                        if (result && result.codeResult && barcodeScanner.isScanning) {
                            const barcode = result.codeResult.code;
                            pauseBarcodeScanner();
                            handleDetectedBarcode(barcode, result.codeResult.format);
                        }
                    });
                });
            } catch (error) { 
                showNotification('Failed to access camera.', 'error'); 
                startFallbackCamera(); 
            }
        }

        function startFallbackCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: barcodeScanner.currentCamera, width: { ideal: 1280 }, height: { ideal: 720 } } })
                .then(stream => {
                    const videoContainer = document.getElementById('interactive'); 
                    videoContainer.innerHTML = '';
                    const video = document.createElement('video'); 
                    video.srcObject = stream; 
                    video.autoplay = true; 
                    video.playsInline = true;
                    video.style.width = '100%'; 
                    video.style.height = '100%'; 
                    video.style.objectFit = 'cover';
                    videoContainer.appendChild(video);
                    setTimeout(() => { if (barcodeScanner.isScanning) simulateBarcodeDetection(); }, 2000);
                }).catch(() => { showNotification('Camera access denied.', 'error'); });
        }

        function pauseBarcodeScanner() { 
            if (barcodeScanner.quaggaInstance && barcodeScanner.isScanning) { 
                barcodeScanner.quaggaInstance.stop(); 
                barcodeScanner.isScanning = false; 
                const startBtn = document.getElementById('startScannerBtn');
                if (startBtn) startBtn.innerHTML = '<i class="fas fa-play"></i> Resume'; 
            } 
        }
        
        function resumeBarcodeScanner() { 
            if (barcodeScanner.quaggaInstance && !barcodeScanner.isScanning) { 
                barcodeScanner.quaggaInstance.start(); 
                barcodeScanner.isScanning = true; 
                const startBtn = document.getElementById('startScannerBtn');
                if (startBtn) startBtn.innerHTML = '<i class="fas fa-pause"></i> Pause'; 
            } 
        }
        
        function stopBarcodeScanner() {
            if (barcodeScanner.quaggaInstance) { 
                barcodeScanner.quaggaInstance.stop(); 
                barcodeScanner.quaggaInstance = null; 
            }
            const videoContainer = document.getElementById('interactive');
            Array.from(videoContainer.getElementsByTagName('video')).forEach(video => { 
                if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop()); 
            });
            videoContainer.innerHTML = ''; 
            barcodeScanner.isScanning = false;
            const startBtn = document.getElementById('startScannerBtn');
            if (startBtn) startBtn.innerHTML = '<i class="fas fa-play"></i> Start Scanner';
        }
        
        function switchCamera() { 
            barcodeScanner.currentCamera = barcodeScanner.currentCamera === 'environment' ? 'user' : 'environment'; 
            showNotification(`Switched to ${barcodeScanner.currentCamera === 'environment' ? 'rear' : 'front'} camera`, 'info'); 
            stopBarcodeScanner(); 
            setTimeout(() => { startRealBarcodeScanner(); }, 500); 
        }

        // ===== BARCODE DETECTION HANDLER =====
        function handleDetectedBarcode(barcode, format) {
            console.log(`Barcode detected: ${barcode} (${format})`);
            
            if (!barcode || barcode === 'CAMERA-BLOCKED') { 
                resumeBarcodeScanner(); 
                return; 
            }
            
            barcodeScanner.scannedBarcodes.push({ 
                code: barcode, 
                format: format, 
                timestamp: new Date().toISOString() 
            });
            
            document.getElementById('scanResults').style.display = 'block';
            document.getElementById('scannedBarcode').textContent = barcode;
            
            const existingProduct = dashboardState.products.find(p => p.barcode === barcode);
            
            if (existingProduct) {
                document.getElementById('productMatchInfo').style.display = 'block';
                document.getElementById('matchedProductName').textContent = existingProduct.name;
                document.getElementById('matchedProductPrice').textContent = existingProduct.price.toLocaleString();
                document.getElementById('matchedProductStock').textContent = existingProduct.stock;
                showNotification(`✅ Found: ${existingProduct.name}`, 'success');
            } else {
                document.getElementById('productMatchInfo').style.display = 'none';
                showNotification(`📦 New product detected: ${barcode}`, 'warning');
            }
            playScanSound();
        }

        function useScannedBarcode() {

            if (barcodeScanner.currentModal === 'addProductModal') {
                document.getElementById('productBarcode').value = barcode;

                closeModal('barcodeScannerModal');
            }
            barcodeScanner.currentModal = null;
        }

        function scanAnother() { 
            document.getElementById('scanResults').style.display = 'none'; 
            resumeBarcodeScanner(); 
        }
        
        function playScanSound() {
            try { 
                const audioContext = new (window.AudioContext || window.webkitAudioContext)(); 
                const oscillator = audioContext.createOscillator(); 
                const gainNode = audioContext.createGain(); 
                oscillator.connect(gainNode); 
                gainNode.connect(audioContext.destination); 
                oscillator.frequency.value = 800; 
                oscillator.type = 'sine'; 
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1); 
                oscillator.start(audioContext.currentTime); 
                oscillator.stop(audioContext.currentTime + 0.1); 
            } catch(e) {}
        }
        
        function simulateBarcodeDetection() {
            if (!barcodeScanner.isScanning) return;
            const demoBarcodes = [
                { code: '8901234567890', name: 'Laptop Pro', price: 89999 }, 
                { code: '123456789012', name: 'Wireless Mouse', price: 1999 }, 
                { code: '978020137962', name: 'Office Chair', price: 12999 }
            ];
            const randomBarcode = demoBarcodes[Math.floor(Math.random() * demoBarcodes.length)];
            pauseBarcodeScanner();
            handleDetectedBarcode(randomBarcode.code, 'demo');
        }

                stock: stock, 
                category: category, 
                barcode: barcode || null, 
                addedDate: new Date().toISOString().split('T')[0] 
            };
            
            dashboardState.products.push(newProduct); 
            closeModal('addProductModal'); 
            showNotification(`Product "${name}" added successfully!`, 'success');
            
            document.getElementById('addProductForm').reset(); 
            resetAddProductForm();
            updateBadgeCounts();
            
            if (currentPage === 'dashboard' || currentPage === 'products') {
                navigateToPage(currentPage);
            }
        }

        function editProduct(productId) {
            const product = dashboardState.products.find(p => p.id === productId); 
            if (!product) return;
            
            document.getElementById('productName').value = product.name; 
            document.getElementById('productPrice').value = product.price; 
            document.getElementById('productStock').value = product.stock; 
            document.getElementById('productCategory').value = product.category; 
            document.getElementById('productBarcode').value = product.barcode || '';
            
            const form = document.getElementById('addProductForm');
            const submitBtn = document.getElementById('addProductSubmitBtn');
            const title = document.getElementById('addProductModalTitle');
            
            form.onsubmit = function(e) { 
                e.preventDefault(); 
                updateProduct(productId); 
            };
            
            if (submitBtn) submitBtn.textContent = 'Update Product';
            if (title) title.textContent = 'Edit Product';
            
            openModal('addProductModal');
        }

        function updateProduct(productId) {
            const productIndex = dashboardState.products.findIndex(p => p.id === productId); 
            if (productIndex === -1) return;
            
            dashboardState.products[productIndex] = { 
                ...dashboardState.products[productIndex], 
                name: document.getElementById('productName').value, 
                price: parseFloat(document.getElementById('productPrice').value), 
                stock: parseInt(document.getElementById('productStock').value), 
                category: document.getElementById('productCategory').value, 
                barcode: document.getElementById('productBarcode').value || null 
            };
            
            closeModal('addProductModal'); 
            showNotification('Product updated successfully!', 'success');
            resetAddProductForm();
            
            if (currentPage === 'dashboard' || currentPage === 'products') {
                navigateToPage(currentPage);
            }
        }

        function deleteProduct(productId) { 
            if (!confirm('Are you sure you want to delete this product?')) return; 
            dashboardState.products = dashboardState.products.filter(p => p.id !== productId); 
            showNotification('Product deleted successfully!', 'success'); 
            updateBadgeCounts(); 
            if (currentPage === 'products') loadProductsPage(); 
            else if (currentPage === 'dashboard') loadDashboardContent();
        }

        // ===== UTILITY FUNCTIONS =====
        function openModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) { 
                modal.classList.add('active'); 
                document.body.style.overflow = 'hidden'; 
            } 
        }
        
        function closeModal(modalId) { 
            const modal = document.getElementById(modalId); 
            if (modal) { 
                modal.classList.remove('active'); 
            } 
            document.body.style.overflow = ''; 
            if (modalId === 'barcodeScannerModal') stopBarcodeScanner(); 
        }
        
        function showNotification(message, type = 'info') { 
            const toast = document.createElement('div'); 
            toast.className = `notification-toast ${type}`; 
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i><span>${message}</span>`; 
            document.body.appendChild(toast); 
            setTimeout(() => { toast.remove(); }, 3000); 
        }
        
        function copyToClipboard(elementId) { 
            const text = document.getElementById(elementId).textContent; 
            navigator.clipboard.writeText(text).then(() => showNotification('Barcode copied to clipboard!', 'success')); 
        }
        
        function updateBadgeCounts() { 
            const productCount = document.getElementById('productCount'); 
            if (productCount) productCount.textContent = dashboardState.products.length; 
        }
        
        function setupSearch() {
            const searchInput = document.getElementById('globalSearch'); 
            if (!searchInput) return;
            
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                if (currentPage === 'products') { 
                    document.querySelectorAll('#productsTable tr').forEach(row => { 
                        const text = row.textContent.toLowerCase(); 
                        row.style.display = text.includes(searchTerm) ? '' : 'none'; 
                    }); 
                } else if (currentPage === 'dashboard') { 
                    document.querySelectorAll('#dashboardProducts tr').forEach(row => { 
                        const text = row.textContent.toLowerCase(); 
                        row.style.display = text.includes(searchTerm) ? '' : 'none'; 
                    }); 
                }
            });
        }

        function setupBarcodeScannerEvents() {
            const startBtn = document.getElementById('startScannerBtn'); 
            if (startBtn) startBtn.addEventListener('click', function() { 
                if (!barcodeScanner.isScanning) startRealBarcodeScanner(); 
                else pauseBarcodeScanner(); 
            });
            
            const stopBtn = document.getElementById('stopScannerBtn'); 
            if (stopBtn) stopBtn.addEventListener('click', stopBarcodeScanner);
            
            const switchBtn = document.getElementById('switchCameraBtn'); 
            if (switchBtn) switchBtn.addEventListener('click', switchCamera);
            
            const manualBtn = document.getElementById('useManualBarcode'); 
            if (manualBtn) manualBtn.addEventListener('click', function() { 
                const manualInput = document.getElementById('manualBarcode'); 
                if (manualInput) { 
                    const manualBarcode = manualInput.value.trim(); 
                    if (manualBarcode && manualBarcode.length >= 8) {
                        handleDetectedBarcode(manualBarcode, 'manual'); 
                    } else { 
                        showNotification('Please enter a valid barcode (min 8 digits)', 'error'); 
                    } 
                } 
            });
            
            const manualInput = document.getElementById('manualBarcode'); 
            if (manualInput) manualInput.addEventListener('keypress', function(e) { 
                if (e.key === 'Enter') document.getElementById('useManualBarcode')?.click(); 
            });
        }

        function setupEventListeners() {
            document.getElementById('menuToggle')?.addEventListener('click', function() { 
                document.querySelector('.sidebar').classList.toggle('active'); 
            });
            
            document.getElementById('themeToggle')?.addEventListener('click', function() { 
                currentTheme = currentTheme === 'light' ? 'dark' : 'light'; 
                document.documentElement.setAttribute('data-theme', currentTheme); 
                this.innerHTML = currentTheme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>'; 
            });
            
            document.getElementById('logoutBtn')?.addEventListener('click', function(e) { 
                e.preventDefault(); 
                if (confirm('Are you sure you want to logout?')) showNotification('Logged out successfully!', 'success'); 
            });
            
            document.querySelectorAll('.modal-close').forEach(button => { 
                button.addEventListener('click', function() { 
                    const modal = this.closest('.modal'); 
                    if (modal) closeModal(modal.id); 
                }); 
            });
            
            document.querySelectorAll('.modal').forEach(modal => { 
                modal.addEventListener('click', function(e) { 
                    if (e.target === this) closeModal(this.id); 
                }); 
            });
            
            document.querySelectorAll('.nav-item[data-page]').forEach(item => { 
                item.addEventListener('click', function(e) { 
                    e.preventDefault(); 
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active')); 
                    this.classList.add('active'); 
                    const page = this.getAttribute('data-page'); 
                    navigateToPage(page); 
                    if (window.innerWidth <= 1024) document.querySelector('.sidebar').classList.remove('active'); 
                }); 
            });
            
            document.getElementById('addProductForm')?.addEventListener('submit', addProduct);
            
            setupBarcodeScannerEvents();
        }
    </script>
</body>
</html>
